name: Build APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch build.gradle.kts
        run: |
          python3 - <<'EOF'
          import re
          with open('app/build.gradle.kts', 'r') as f:
              content = f.read()

          patch = '''isCrunchPngs = true
                  isMinifyEnabled = true
                  isShrinkResources = true
                  proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'''
          content = re.sub(r'\s*signingConfig = signingConfigs\.getByName\("debugConfig"\)', '\n        ' + patch, content)

          splits = '''
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
                      isUniversalApk = false
                  }
              }
          '''
          content = re.sub(r'(android\s*\{)', r'\1\n' + splits, content, count=1)

          with open('app/build.gradle.kts', 'w') as f:
              f.write(content)
          EOF

      - name: Prepare environment and keystore
        run: |
          touch .env
          touch app/proguard-rules.pro
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APKs by ABI
        run: |
          mkdir -p output
          for apk in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$apk" | sed -E 's/app-(.*)-debug\.apk/\1/')
            cp "$apk" "output/${{ github.event.repository.name }}-${abi}.apk"
          done

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-armeabi-v7a
          path: output/${{ github.event.repository.name }}-armeabi-v7a.apk

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-arm64-v8a
          path: output/${{ github.event.repository.name }}-arm64-v8a.apk

      - name: Upload x86
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-x86
          path: output/${{ github.event.repository.name }}-x86.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-x86_64
          path: output/${{ github.event.repository.name }}-x86_64.apk
