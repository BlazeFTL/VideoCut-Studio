name: Build APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch build.gradle.kts
        run: |
          python3 - <<'EOF'
          import re
          with open('app/build.gradle.kts', 'r') as f:
              content = f.read()

          patch = '''isCrunchPngs = true
                  isMinifyEnabled = true
                  isShrinkResources = true
                  proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  signingConfig = signingConfigs.getByName("debugConfig")'''
          content = re.sub(r'\s*signingConfig = signingConfigs\.getByName\("debugConfig"\)', '\n        ' + patch, content)

          splits = '''
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
                      isUniversalApk = false
                  }
              }
          '''
          content = re.sub(r'(android\s*\{)', r'\1\n' + splits, content, count=1)

          with open('app/build.gradle.kts', 'w') as f:
              f.write(content)
          EOF

      - name: Prepare environment and keystore
        run: |
          touch .env
          touch app/proguard-rules.pro
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore || true
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APKs by ABI
        run: |
          mkdir -p output
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs found in app/build/outputs/apk/debug/"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            if [[ "$base" =~ app-(.*)-debug\.apk ]]; then
              abi="${BASH_REMATCH[1]}"
            else
              abi="universal"
            fi
            echo "Copying $apk to output/${{ github.event.repository.name }}-${abi}.apk"
            cp "$apk" "output/${{ github.event.repository.name }}-${abi}.apk"
          done

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}-armeabi-v7a
          path: output/${{ github.event.repository.name }}-armeabi-v7a.apk
          if-no-files-found: ignore

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}-arm64-v8a
          path: output/${{ github.event.repository.name }}-arm64-v8a.apk
          if-no-files-found: ignore

      - name: Upload x86
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}-x86
          path: output/${{ github.event.repository.name }}-x86.apk
          if-no-files-found: ignore

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}-x86_64
          path: output/${{ github.event.repository.name }}-x86_64.apk
          if-no-files-found: ignore

      - name: Upload All Built APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}-all-apks
          path: output/*.apk
          if-no-files-found: ignore
