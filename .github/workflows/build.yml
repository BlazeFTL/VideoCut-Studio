name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: Create GitHub release
        type: boolean
        default: false
      tag:
        description: Release tag (empty = v<run number>)
        type: string
        default: ""
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Patch build.gradle.kts
        run: |
          python3 - <<'EOF'
          import re
          with open('app/build.gradle.kts', 'r') as f:
              content = f.read()

          splits = '''
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
                      isUniversalApk = true
                  }
              }
          '''
          if 'splits {' not in content:
              content = re.sub(r'(android\s*\{)', r'\1\n' + splits, content, count=1)

          with open('app/build.gradle.kts', 'w') as f:
              f.write(content)
          EOF

      - name: Prepare environment and keystore
        run: |
          touch .env
          touch .env.example
          touch app/proguard-rules.pro
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore || true
            fi
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug --stacktrace
          else
            chmod +x gradlew 2>/dev/null || true
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Rename APKs by ABI
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p output
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs found in app/build/outputs/apk/debug/"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            if [[ "$base" =~ app-(.*)-debug\.apk ]]; then
              abi="${BASH_REMATCH[1]}"
            else
              abi="universal"
            fi
            echo "Copying $apk to output/${REPO_NAME}-${abi}.apk"
            cp "$apk" "output/${REPO_NAME}-${abi}.apk"
          done

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: output/${{ github.event.repository.name }}-armeabi-v7a.apk
          archive: false
          if-no-files-found: ignore

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: output/${{ github.event.repository.name }}-arm64-v8a.apk
          archive: false
          if-no-files-found: ignore

      - name: Upload x86
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: output/${{ github.event.repository.name }}-x86.apk
          archive: false
          if-no-files-found: ignore

      - name: Upload x86_64
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: output/${{ github.event.repository.name }}-x86_64.apk
          archive: false
          if-no-files-found: ignore

      - name: Upload Universal APK
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: output/${{ github.event.repository.name }}-universal.apk
          archive: false
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="${INPUT_TAG:-v${{ github.run_number }}}"
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/*.apk --clobber
          else
            gh release create "$TAG" output/*.apk \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --generate-notes \
              "${FLAGS[@]}"
          fi
